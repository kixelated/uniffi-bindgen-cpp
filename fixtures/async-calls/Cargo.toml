[package]
name = "uniffi-async-calls"
version = "0.21.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "uniffi_fixture_async_calls"
crate-type = ["lib"]

[dependencies]
once_cell = "1.18.0"
futures-timer = "3.0"
thiserror = "1.0"
tokio = { version = "1.24.1", features = ["time", "sync"] }
uniffi = { workspace = true, features = ["tokio"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
