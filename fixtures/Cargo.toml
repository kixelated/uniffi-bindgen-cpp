[package]
name = "uniffi-bindgen-cpp-fixtures"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[dependencies]
uniffi-example-arithmetic = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-callbacks = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-custom-types = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-geometry = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-rondpoint = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-sprites = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-todolist = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-example-traits = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-fixture-callbacks = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-fixture-coverall = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-fixture-docstring = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-fixture-time = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }
uniffi-fixture-trait-methods = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.2" }

uniffi-error-types-builtin = { path = "error-types-builtin" }
uniffi-custom-types-builtin = { path = "custom-types-builtin" }
uniffi-enum-style-test = { path = "enum-style-test" }
uniffi-empty-type = { path = "empty-type" }
uniffi-reserved-field-name = { path = "reserved-field-name" }
uniffi-type-flattening = { path = "type-flattening" }

uniffi-ext-types-export = { path = "ext-types-export" }
uniffi-ext-types-import = { path = "ext-types-import" }
